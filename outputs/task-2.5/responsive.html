<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Hero — responsive App preview</title></head>
<body>
<label>Viewport <select id="size"><option>320</option><option>390</option><option>768</option><option>1280</option><option>1920</option></select></label>
<label>Height <select id="height"><option>800</option><option>390</option><option>1080</option></select></label>
<iframe title="Stellar Odyssey responsive App" id="preview" src="/" width="320" height="800" frameborder="0"></iframe>
<script>
  const frame = document.querySelector('#preview');
  document.querySelector('#size').onchange = event => frame.width = event.target.value;
  document.querySelector('#height').onchange = event => frame.height = event.target.value;
</script>
</body>
</html>
